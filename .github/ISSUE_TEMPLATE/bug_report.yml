name: Bug Report
description: Reportar un error o comportamiento inesperado
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por reportar un bug. Por favor completá la siguiente información para ayudarnos a reproducir y resolver el problema.

  - type: textarea
    id: description
    attributes:
      label: Descripción del bug
      description: Descripción clara y concisa del problema.
      placeholder: "Al intentar..., ocurre..."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducir
      description: Pasos detallados para reproducir el comportamiento.
      placeholder: |
        1. Ir a '...'
        2. Hacer clic en '...'
        3. Ver error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Comportamiento esperado
      description: Qué esperabas que ocurriera.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Comportamiento actual
      description: Qué ocurrió realmente.
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Plataforma
      options:
        - Linux
        - Windows
        - macOS
        - No aplica
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Versión
      description: Versión de la app o commit hash.
      placeholder: "v0.1.0 / abc1234"
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs / salida de consola
      description: Pegá aquí cualquier log o mensaje de error relevante.
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: Busqué en issues existentes y no encontré uno similar
          required: true
        - label: Incluí toda la información necesaria para reproducir el bug
          required: true
