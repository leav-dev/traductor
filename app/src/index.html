<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>sussurro</title>
    <script src="main.js" defer></script>
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div class="brand">
          <span class="logo"></span>
          <span class="wordmark">sussurro</span>
        </div>
      </header>

      <div class="langbar">
        <div class="lang-dd" id="src-dd">
          <button class="lang-trigger" type="button" aria-haspopup="listbox" aria-expanded="false" aria-label="Source language">
            <span class="lang-current">Italiano</span>
            <svg class="caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
          </button>
          <ul class="lang-menu" role="listbox">
            <li role="option" data-lang="en">English</li>
            <li role="option" data-lang="fr">Français</li>
            <li role="option" data-lang="es">Español</li>
            <li role="option" data-lang="it">Italiano</li>
          </ul>
        </div>
        <button class="swap" id="swap-btn" type="button" title="Swap languages" aria-label="Swap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 10 4 7l3-3"/><path d="M4 7h12"/><path d="m17 14 3 3-3 3"/><path d="M20 17H8"/></svg>
        </button>
        <div class="lang-dd" id="tgt-dd">
          <button class="lang-trigger" type="button" aria-haspopup="listbox" aria-expanded="false" aria-label="Target language">
            <span class="lang-current">Français</span>
            <svg class="caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
          </button>
          <ul class="lang-menu" role="listbox">
            <li role="option" data-lang="en">English</li>
            <li role="option" data-lang="fr">Français</li>
            <li role="option" data-lang="es">Español</li>
            <li role="option" data-lang="it">Italiano</li>
          </ul>
        </div>
      </div>

      <section class="card card-in">
        <div class="card-label" id="src-label">ITALIAN</div>
        <div class="card-text" id="src-text" contenteditable="true" spellcheck="false" data-placeholder="Tap the mic, or type here…"></div>
        <button class="icon-btn mic-mini" id="mic-mini" type="button" title="Record" aria-label="Record">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><line x1="12" y1="18" x2="12" y2="21"/></svg>
        </button>
      </section>

      <div class="chevron">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
      </div>

      <section class="card card-out">
        <div class="card-label" id="tgt-label">FRENCH</div>
        <div class="card-text" id="tgt-text" data-placeholder="Translation appears here…"></div>
        <button class="icon-btn speaker" id="replay-btn" type="button" title="Play" aria-label="Play">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M16 9a4 4 0 0 1 0 6"/><path d="M19 7a8 8 0 0 1 0 10"/></svg>
        </button>
      </section>

      <div class="toggles">
        <div class="toggle">
          <span class="toggle-label">INPUT</span>
          <button class="seg active" id="in-keyboard" type="button" aria-label="Keyboard">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></svg>
          </button>
          <button class="seg" id="in-mic" type="button" aria-label="Microphone">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><line x1="12" y1="18" x2="12" y2="21"/></svg>
          </button>
        </div>
        <div class="toggle">
          <span class="toggle-label">OUTPUT</span>
          <button class="seg active" id="out-text" type="button">Aa</button>
          <button class="seg" id="out-voice" type="button" aria-label="Speaker">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M16 9a4 4 0 0 1 0 6"/><path d="M19 7a8 8 0 0 1 0 10"/></svg>
          </button>
        </div>
      </div>

      <div class="mic-wrap">
        <button class="mic-big" id="record-btn" type="button" aria-label="Tap to speak">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><line x1="12" y1="18" x2="12" y2="21"/></svg>
        </button>
        <p class="hint" id="status">Tap to speak · or type above</p>
      </div>
    </main>
  </body>
</html>
